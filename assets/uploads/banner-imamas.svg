<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#241d15"/>
      <stop offset="100%" stop-color="#120e09"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#C5A059" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#grid)"/>
  <circle cx="800" cy="250" r="140" fill="none" stroke="#C5A059" stroke-opacity="0.25" stroke-width="1.5"/>
  <text x="50%" y="43%" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="136" fill="#fdfaf7" letter-spacing="2">Imama Collection</text>
  <text x="50%" y="43%" dy="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" fill="#C5A059" letter-spacing="6" text-transform="uppercase">SIGNATURE SERIES</text>
