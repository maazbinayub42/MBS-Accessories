<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBS Islamic Accessories — Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Jost', sans-serif;
      background: #17130F;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      background: #F8F5EF;
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .login-logo {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      object-fit: contain;
      margin-bottom: 16px;
    }

    .login-brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      font-weight: 600;
      color: #17130F;
      margin-bottom: 4px;
    }

    .login-subtitle {
      font-size: 14px;
      color: #888;
      margin-bottom: 32px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 400;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #555;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      font-family: 'Jost', sans-serif;
      font-size: 15px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      background: #fff;
      color: #17130F;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .form-group input:focus {
      border-color: #C6A15B;
      box-shadow: 0 0 0 3px rgba(198, 161, 91, 0.15);
    }

    .login-error {
      display: none;
      background: #fef2f2;
      color: #dc2626;
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid #fecaca;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      font-family: 'Jost', sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      background: #C6A15B;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .login-btn:hover {
      background: #b8933f;
    }

    .login-btn:active {
      transform: scale(0.98);
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 36px 24px;
      }
    }
  </style>
</head>
<body>

  <div class="login-card">
    <img src="../assets/logo/logo.png" alt="MBS" class="login-logo">
    <div class="login-brand">MBS Islamic Accessories</div>
    <div class="login-subtitle">Admin Dashboard</div>

    <div class="login-error" id="login-error"></div>

    <div class="form-group">
      <label for="login-username">Username</label>
      <input type="text" id="login-username" placeholder="Enter username" autocomplete="username">
    </div>

    <div class="form-group">
      <label for="login-password">Password</label>
      <input type="password" id="login-password" placeholder="Enter password" autocomplete="current-password">
    </div>

    <button class="login-btn" id="login-btn">Sign In</button>
  </div>

  <script>
    var AUTH_CONFIG = {
      username: 'MBS12',
      password: 'mbs1changed'
    };

    document.getElementById('login-btn').addEventListener('click', function() {
      var u = document.getElementById('login-username').value;
      var p = document.getElementById('login-password').value;
      var err = document.getElementById('login-error');

      if (u === AUTH_CONFIG.username && p === AUTH_CONFIG.password) {
        sessionStorage.setItem('mbs_admin_auth', 'true');
        sessionStorage.setItem('mbs_admin_auth_time', Date.now().toString());
        window.location.href = 'index.html';
      } else {
        err.textContent = 'Invalid username or password';
        err.style.display = 'block';
      }
    });

    document.getElementById('login-password').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') document.getElementById('login-btn').click();
    });

    document.getElementById('login-username').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') document.getElementById('login-btn').click();
    });

    if (sessionStorage.getItem('mbs_admin_auth') === 'true') {
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
